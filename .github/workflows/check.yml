name: Check

on:
  pull_request:
  push:
    branches: [main]

# 门就是本地那一条 `bun run lint` 加一次构建，一字不差 —— CI 和本地跑的不是同一组
# 命令，是「在我机器上是好的」的标准来源。
#
# 步骤写在这里而不是复用组织里的 web-check.yml，理由和 can-controller 一样：那份
# 工作流的输入形状要去 JianyueLab-Org/actions 里确认，猜错了 CI 会以
# startup_failure 收场，而那种失败连日志都没有。
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --frozen-lockfile：CI 不该顺手升级依赖。锁文件对不上就该红，而不是装一套
      # 和本地不同的东西然后通过。
      #
      # GITHUB_TOKEN 是给 can-ui 用的：它装在 GitHub Packages 上，而 GitHub 的 npm
      # registry **即使是公开包也要求带令牌**。.npmrc 里写的是
      # `_authToken=${GITHUB_TOKEN}`，那个变量在安装时才从环境里读，Actions 不会
      # 自动把它放进 env —— 缺了就是 401，而且报的是下载地址，不是「少了个环境
      # 变量」。
      - run: bun install --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # format:check + astro check + vue-tsc。最后那个是必要的：astro check 对 Vue
      # SFC 里的任何类型错误都报 0 错误，而机场清单和航路点浏览都是 Vue。
      - run: bun run lint

      - run: bun run build
